<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#16a34a"><title>CobranzaVentas</title>
<style>
:root{--bg:#f5f7f6;--card:#fff;--text:#17201b;--muted:#6b7280;--green:#16a34a;--green2:#15803d;--yellow:#d97706;--orange:#ea580c;--red:#dc2626;--line:#e5e7eb;--shadow:0 8px 28px rgba(16,24,20,.07)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.app{max-width:1100px;margin:auto;padding-bottom:90px}.top{padding:24px 20px 12px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:24px;font-weight:850;letter-spacing:-.6px}.brand span{color:var(--green)}.sub{font-size:13px;color:var(--muted);margin-top:3px}.icon{width:42px;height:42px;border-radius:14px;background:#fff;box-shadow:var(--shadow);display:grid;place-items:center;font-size:20px}.content{padding:8px 20px}.hero{background:linear-gradient(135deg,#15803d,#22c55e);color:#fff;border-radius:24px;padding:22px;box-shadow:var(--shadow)}.hero .label{opacity:.85;font-size:13px;font-weight:700;text-transform:uppercase}.hero .money{font-size:38px;font-weight:850;margin:8px 0 5px;letter-spacing:-1px}.hero small{opacity:.9}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}.stat .k{font-size:12px;color:var(--muted);font-weight:700}.stat .v{font-size:22px;font-weight:800;margin-top:6px}.section{margin-top:22px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.section h2{font-size:17px;margin:0}.link{color:var(--green2);font-weight:750;background:none}.sale{display:flex;gap:13px;align-items:center}.dot{width:11px;height:11px;border-radius:50%;flex:none}.sale-main{flex:1;min-width:0}.sale-name{font-weight:800}.sale-desc{font-size:12px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sale-right{text-align:right}.sale-right strong{display:block}.days{font-size:12px;font-weight:750;margin-top:4px}.green{color:var(--green2)}.yellow{color:var(--yellow)}.orange{color:var(--orange)}.red{color:var(--red)}.empty{padding:35px;text-align:center;color:var(--muted)}.bottom{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:10}.nav{max-width:700px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}.nav button{background:none;color:var(--muted);font-size:11px;font-weight:700;padding:5px}.nav button.active{color:var(--green2)}.nav .plus{background:var(--green);color:white;width:48px;height:48px;border-radius:16px;margin:-19px auto 0;box-shadow:0 8px 20px rgba(22,163,74,.3);font-size:22px}.screen{display:none}.screen.active{display:block}.toolbar{display:flex;gap:8px;overflow:auto;margin:8px 0 14px}.chip{white-space:nowrap;padding:9px 13px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--muted);font-size:12px;font-weight:750}.chip.active{background:#dcfce7;color:#166534;border-color:#bbf7d0}.search{display:flex;gap:8px;margin-bottom:12px}.search input{flex:1}.form{display:grid;gap:14px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px;color:#4b5563}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:13px;padding:13px;background:#fff;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:#86efac;box-shadow:0 0 0 3px #dcfce7}.btn{width:100%;padding:14px;border-radius:14px;background:var(--green);color:#fff;font-weight:850}.btn.secondary{background:#fff;color:var(--green2);border:1px solid #bbf7d0}.btn.danger{background:#fee2e2;color:#991b1b}.detail-head{display:flex;align-items:center;gap:10px;margin-bottom:15px}.back{background:none;font-size:22px}.detail-title{font-size:21px;font-weight:850}.big-balance{text-align:center;padding:22px}.big-balance .amount{font-size:34px;font-weight:900;margin:8px}.progress{height:10px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin:12px 0}.progress>i{display:block;height:100%;background:var(--green);border-radius:999px}.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:30}.modal.open{display:flex}.sheet{background:#fff;width:100%;max-width:700px;margin:auto;border-radius:24px 24px 0 0;padding:20px;max-height:90vh;overflow:auto}.sheet h2{margin-top:0}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:#17201b;color:#fff;padding:11px 16px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:50}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}@media(min-width:760px){.app{padding-bottom:25px}.bottom{position:sticky;top:0;bottom:auto;border-top:0;border-bottom:1px solid var(--line)}.nav{max-width:1100px}.nav .plus{margin:0}.stats{gap:16px}.content{padding:15px 28px}.top{padding:28px}.modal{align-items:center}.sheet{border-radius:24px;max-width:560px}}
</style></head>
<body>
<div class="app">
<header class="top"><div><div class="brand">Cobranza<span>Ventas</span></div><div class="sub" id="today"></div></div><button class="icon" onclick="showScreen('settings')">⚙️</button></header>
<main class="content">
<section id="home" class="screen active"><div class="hero"><div class="label">Saldo por cobrar</div><div class="money" id="dashPending">$0.00</div><small><span id="pendingCount">0</span> ventas pendientes</small></div><div class="stats"><div class="card stat"><div class="k">Vendido</div><div class="v" id="dashSold">$0</div></div><div class="card stat"><div class="k">Cobrado</div><div class="v" id="dashPaid">$0</div></div><div class="card stat"><div class="k">Pagado %</div><div class="v" id="dashPct">0%</div></div></div><div class="section"><div class="section-head"><h2>⚠️ Atención prioritaria</h2><button class="link" onclick="showScreen('sales')">Ver todas →</button></div><div id="priority"></div></div></section>
<section id="sales" class="screen"><div class="section-head"><h2>Ventas</h2><button class="btn" style="width:auto;padding:10px 14px" onclick="showScreen('new')">＋ Nueva</button></div><div class="search"><input id="search" placeholder="Buscar cliente o producto..." oninput="renderSales()"></div><div class="toolbar"><button class="chip active" data-filter="all" onclick="setFilter('all',this)">Todas</button><button class="chip" data-filter="pending" onclick="setFilter('pending',this)">Pendientes</button><button class="chip" data-filter="partial" onclick="setFilter('partial',this)">Abono parcial</button><button class="chip" data-filter="paid" onclick="setFilter('paid',this)">Pagadas</button></div><div id="salesList"></div></section>
<section id="new" class="screen"><div class="detail-head"><button class="back" onclick="showScreen('home')">‹</button><div class="detail-title">Nueva venta</div></div><div class="card"><form class="form" onsubmit="saveSale(event)"><div class="field"><label>Cliente *</label><input id="client" required placeholder="Nombre del cliente"></div><div class="field"><label>Teléfono</label><input id="phone" placeholder="Opcional"></div><div class="field"><label>Producto / descripción *</label><input id="desc" required placeholder="Ej. Toyota Corolla 2022"></div><div class="field"><label>Fecha de venta *</label><input id="saleDate" type="date" required></div><div class="field"><label>Total de la venta *</label><input id="total" type="number" min="0.01" step="0.01" required placeholder="0.00"></div><div class="field"><label>Abono inicial</label><input id="initial" type="number" min="0" step="0.01" value="0" placeholder="0.00"></div><div class="field"><label>Observaciones</label><textarea id="notes" rows="3" placeholder="Notas opcionales"></textarea></div><button class="btn">✓ Registrar venta</button></form></div></section>
<section id="detail" class="screen"><div id="detailContent"></div></section>
<section id="clients" class="screen"><div class="section-head"><h2>Clientes</h2></div><div class="search"><input id="clientSearch" placeholder="Buscar cliente..." oninput="renderClients()"></div><div id="clientList"></div></section>
<section id="settings" class="screen"><div class="detail-head"><button class="back" onclick="showScreen('home')">‹</button><div class="detail-title">Configuración</div></div><div class="card"><div class="row"><span>Moneda</span><strong>USD ($)</strong></div><div class="row"><span>Datos almacenados</span><strong id="storageCount">0 ventas</strong></div><div class="row"><span>Versión</span><strong>1.0 MVP</strong></div></div><div style="height:12px"></div><button class="btn secondary" onclick="exportData()">⬇️ Exportar respaldo JSON</button><div style="height:10px"></div><button class="btn danger" onclick="clearAll()">🗑️ Borrar todas las ventas</button></section>
</main></div>
<nav class="bottom"><div class="nav"><button data-screen="home" class="active" onclick="showScreen('home')">🏠<br>Inicio</button><button data-screen="sales" onclick="showScreen('sales')">📋<br>Ventas</button><button class="plus" onclick="showScreen('new')">＋</button><button data-screen="clients" onclick="showScreen('clients')">👥<br>Clientes</button><button data-screen="settings" onclick="showScreen('settings')">⚙️<br>Ajustes</button></div></nav>
<div class="modal" id="paymentModal"><div class="sheet"><h2>Registrar abono</h2><div id="paymentInfo"></div><form class="form" onsubmit="savePayment(event)"><div class="field"><label>Monto del abono *</label><input id="paymentAmount" type="number" min="0.01" step="0.01" required></div><div class="field"><label>Fecha</label><input id="paymentDate" type="date" required></div><div class="field"><label>Método de pago</label><select id="paymentMethod"><option>Efectivo</option><option>Transferencia</option><option>Pago móvil</option><option>Tarjeta</option><option>Otro</option></select></div><div class="field"><label>Nota</label><input id="paymentNote" placeholder="Opcional"></div><button class="btn">✓ Registrar pago</button><button type="button" class="btn secondary" onclick="closeModal()">Cancelar</button></form></div></div>
<div class="toast" id="toast"></div>
<script>
const KEY='cobranzaventas_v1';let sales=JSON.parse(localStorage.getItem(KEY)||'[]');let filter='all';let selectedId=null;
const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(n)||0);const dateOnly=s=>new Date(s+'T00:00:00');const todayStr=()=>{const d=new Date();return d.toISOString().slice(0,10)};const daysSince=s=>Math.max(0,Math.floor((new Date()-dateOnly(s))/86400000));
function persist(){localStorage.setItem(KEY,JSON.stringify(sales));updateAll()};function totalPaid(s){return (s.payments||[]).reduce((a,p)=>a+Number(p.amount),0)}function pending(s){return Math.max(0,Number(s.total)-totalPaid(s))}function status(s){const p=pending(s),a=totalPaid(s);return p<=.009?'paid':a>0?'partial':'pending'}
function ageClass(d){return d<=7?'green':d<=15?'yellow':d<=30?'orange':'red'}function statusLabel(s){return status(s)==='paid'?'Pagada':status(s)==='partial'?'Abono parcial':'Pendiente'}
function saleCard(s){const p=pending(s),d=daysSince(s.date), st=status(s);return `<button class="card sale" style="width:100%;text-align:left;margin-bottom:10px" onclick="openDetail('${s.id}')"><span class="dot" style="background:${st==='paid'?'#16a34a':d>30?'#dc2626':d>15?'#ea580c':d>7?'#d97706':'#16a34a'}"></span><span class="sale-main"><span class="sale-name">${esc(s.client)}</span><span class="sale-desc">${esc(s.desc)} · ${statusLabel(s)}</span></span><span class="sale-right"><strong>${money(p)}</strong><span class="days ${ageClass(d)}">${st==='paid'?'✓ Pagada':`Hace ${d} ${d===1?'día':'días'}`}</span></span></button>`}
function esc(x){return String(x??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function updateAll(){renderDashboard();renderSales();renderClients();document.getElementById('storageCount').textContent=`${sales.length} ${sales.length===1?'venta':'ventas'}`}
function renderDashboard(){let sold=sales.reduce((a,s)=>a+Number(s.total),0),paid=sales.reduce((a,s)=>a+totalPaid(s),0),pend=Math.max(0,sold-paid),pc=sales.filter(s=>pending(s)>0).length;document.getElementById('dashPending').textContent=money(pend);document.getElementById('dashSold').textContent=money(sold);document.getElementById('dashPaid').textContent=money(paid);document.getElementById('dashPct').textContent=sold?Math.round(paid/sold*100)+'%':'0%';document.getElementById('pendingCount').textContent=pc;let arr=sales.filter(s=>pending(s)>0).sort((a,b)=>daysSince(b.date)-daysSince(a.date)||pending(b)-pending(a)).slice(0,5);document.getElementById('priority').innerHTML=arr.length?arr.map(saleCard).join(''):'<div class="card empty">🎉 No tienes cuentas pendientes.</div>'}
function renderSales(){let q=(document.getElementById('search')?.value||'').toLowerCase();let arr=sales.filter(s=>(s.client+' '+s.desc).toLowerCase().includes(q));if(filter!=='all')arr=arr.filter(s=>status(s)===filter);arr.sort((a,b)=>pending(b)-pending(a)||daysSince(b.date)-daysSince(a.date));document.getElementById('salesList').innerHTML=arr.length?arr.map(saleCard).join(''):'<div class="card empty">No hay ventas que mostrar.</div>'}
function renderClients(){let q=(document.getElementById('clientSearch')?.value||'').toLowerCase();let map={};sales.forEach(s=>{if(!map[s.client])map[s.client]={client:s.client,phone:s.phone||'',count:0,pending:0};map[s.client].count++;map[s.client].pending+=pending(s)});let arr=Object.values(map).filter(x=>x.client.toLowerCase().includes(q)).sort((a,b)=>b.pending-a.pending);document.getElementById('clientList').innerHTML=arr.length?arr.map(c=>`<div class="card" style="margin-bottom:10px"><div class="row"><div><strong>${esc(c.client)}</strong><div class="sale-desc">${c.count} ${c.count===1?'venta':'ventas'}${c.phone?' · '+esc(c.phone):''}</div></div><strong class="${c.pending?'red':'green'}">${money(c.pending)}</strong></div></div>`).join(''):'<div class="card empty">No hay clientes.</div>'}
function showScreen(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.nav button[data-screen]').forEach(x=>x.classList.toggle('active',x.dataset.screen===id));if(id==='home')renderDashboard();if(id==='sales')renderSales();if(id==='clients')renderClients();window.scrollTo({top:0,behavior:'smooth'})}
function setFilter(f,el){filter=f;document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));el.classList.add('active');renderSales()}
function saveSale(e){e.preventDefault();let total=Number(document.getElementById('total').value),initial=Number(document.getElementById('initial').value||0);if(initial>total){toast('El abono no puede superar el total');return}let s={id:crypto.randomUUID(),client:document.getElementById('client').value.trim(),phone:document.getElementById('phone').value.trim(),desc:document.getElementById('desc').value.trim(),date:document.getElementById('saleDate').value,total,payments:initial?[{id:crypto.randomUUID(),amount:initial,date:todayStr(),method:'Abono inicial',note:''}]:[],notes:document.getElementById('notes').value.trim()};sales.unshift(s);persist();e.target.reset();document.getElementById('saleDate').value=todayStr();document.getElementById('initial').value='0';toast('Venta registrada correctamente');showScreen('sales')}
function openDetail(id){selectedId=id;let s=sales.find(x=>x.id===id);if(!s)return;let p=pending(s),paid=totalPaid(s),d=daysSince(s.date),pct=s.total?Math.min(100,paid/s.total*100):0;document.getElementById('detailContent').innerHTML=`<div class="detail-head"><button class="back" onclick="showScreen('sales')">‹</button><div><div class="detail-title">${esc(s.client)}</div><div class="sub">${esc(s.desc)}</div></div></div><div class="card big-balance"><div class="sub">${statusLabel(s)} · ${d} ${d===1?'día':'días'} desde la venta</div><div class="amount ${p?'red':'green'}">${money(p)}</div><strong>${p?'Pendiente por pagar':'Venta pagada ✓'}</strong><div class="progress"><i style="width:${pct}%"></i></div><div class="sub">${money(paid)} abonado de ${money(s.total)} · ${Math.round(pct)}%</div></div><div style="height:12px"></div><div class="card"><div class="row"><span>Fecha de venta</span><strong>${dateOnly(s.date).toLocaleDateString('es-ES')}</strong></div><div class="row"><span>Total</span><strong>${money(s.total)}</strong></div><div class="row"><span>Abonado</span><strong class="green">${money(paid)}</strong></div><div class="row"><span>Pendiente</span><strong class="red">${money(p)}</strong></div>${s.phone?`<div class="row"><span>Teléfono</span><strong>${esc(s.phone)}</strong></div>`:''}${s.notes?`<div class="row"><span>Nota</span><strong>${esc(s.notes)}</strong></div>`:''}</div><div style="height:12px"></div><div class="card"><h3 style="margin-top:0">Historial de abonos</h3>${(s.payments||[]).length?s.payments.map(p=>`<div class="row"><div><strong>${money(p.amount)}</strong><div class="sale-desc">${dateOnly(p.date).toLocaleDateString('es-ES')} · ${esc(p.method||'')}</div>${p.note?`<div class="sale-desc">${esc(p.note)}</div>`:''}</div><span class="green">✓</span></div>`).join(''):'<div class="empty">Aún no hay abonos.</div>'}</div><div style="height:12px"></div>${p?`<button class="btn" onclick="openPayment('${s.id}')">💵 Registrar abono</button>`:''}<div style="height:10px"></div><button class="btn danger" onclick="deleteSale('${s.id}')">🗑️ Eliminar venta</button>`;showScreen('detail')}
function openPayment(id){selectedId=id;let s=sales.find(x=>x.id===id);document.getElementById('paymentInfo').innerHTML=`<div class="card" style="margin-bottom:12px"><strong>${esc(s.client)}</strong><div class="sale-desc">Saldo actual: ${money(pending(s))}</div></div>`;document.getElementById('paymentAmount').max=pending(s);document.getElementById('paymentAmount').value='';document.getElementById('paymentDate').value=todayStr();document.getElementById('paymentModal').classList.add('open')}
function closeModal(){document.getElementById('paymentModal').classList.remove('open')}
function savePayment(e){e.preventDefault();let s=sales.find(x=>x.id===selectedId),amount=Number(document.getElementById('paymentAmount').value);if(amount<=0||amount>pending(s)+.009){toast('Monto de abono inválido');return}s.payments.push({id:crypto.randomUUID(),amount,date:document.getElementById('paymentDate').value,method:document.getElementById('paymentMethod').value,note:document.getElementById('paymentNote').value.trim()});persist();closeModal();toast(pending(s)<=.009?'¡Venta pagada completamente!':'Abono registrado');openDetail(s.id)}
function deleteSale(id){if(!confirm('¿Eliminar esta venta y su historial de abonos?'))return;sales=sales.filter(s=>s.id!==id);persist();toast('Venta eliminada');showScreen('sales')}
function exportData(){let blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),sales},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='cobranzaventas-respaldo.json';a.click();URL.revokeObjectURL(a.href);toast('Respaldo descargado')}
function clearAll(){if(confirm('Esto eliminará todas las ventas. ¿Continuar?')){sales=[];persist();toast('Datos eliminados')}}function toast(t){let x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2200)}
document.getElementById('today').textContent=new Date().toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long',year:'numeric'});document.getElementById('saleDate').value=todayStr();updateAll();
</script></body></html>
